# Local LLM
spring.ai.openai.api-key=ignored

#docker
spring.ai.openai.base-url=http://localhost:12434/engines
spring.ai.openai.chat.options.model=huggingface.co/yuxinlu1/gemma-4-12b-coder-fable5-composer2.5-v1-gguf:Q4_K_M

#logging.level.org.springframework.ai=DEBUG
logging.level.com.github.ehdez73.code2req=DEBUG

# Sync mode for easier local debugging (LLM calls on caller thread)
code2req.enrichment.execution-mode=sync

# Disable JSON_SCHEMA strict mode for models that don't support it (e.g. DeepSeek)
code2req.enrichment.strict-response-format=true

embabel.agent.platform.llm-operations.prompts.default-timeout=120s

