# OPENCODE LLM
spring.ai.openai.chat.options.model=deepseek-v4-flash
spring.ai.openai.api-key=${OPENCODE_API_KEY}
spring.ai.openai.base-url=https://opencode.ai/zen/go

logging.level.org.springframework.ai=INFO
logging.level.com.github.ehdez73.code2req=DEBUG

# Sync mode for easier local debugging (LLM calls on caller thread)
code2req.enrichment.execution-mode=async

# Disable JSON_SCHEMA strict mode for models that don't support it (e.g. DeepSeek)
code2req.enrichment.strict-response-format=false

embabel.agent.platform.llm-operations.prompts.default-timeout=120s
embabel.agent.platform.models.openai.custom.api-key=${spring.ai.openai.api-key}
embabel.agent.platform.models.openai.custom.base-url=${spring.ai.openai.base-url}
embabel.agent.platform.models.openai.custom.models=${spring.ai.openai.chat.options.model}
