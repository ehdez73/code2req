# Local LLM
spring.ai.openai.api-key=ignored

#docker
spring.ai.openai.base-url=http://localhost:12434/engines
spring.ai.openai.chat.options.model=docker.io/ai/gemma4:12B

#logging.level.org.springframework.ai=DEBUG

# Sync mode for easier local debugging (LLM calls on caller thread)
code2req.execution.execution-mode=sync


embabel.agent.platform.llm-operations.prompts.default-timeout=120s

