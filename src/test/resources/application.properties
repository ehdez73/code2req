spring.shell.interactive.enabled=false
spring.autoconfigure.exclude=org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration,com.embabel.agent.autoconfigure.platform.AgentPlatformAutoConfiguration

# Embabel Agent Framework (Phase 3 GOAP planning)
embabel.models.default-llm=${spring.ai.openai.chat.options.model}
embabel.models.llms.cheapest=${spring.ai.openai.chat.options.model}
embabel.models.llms.best=${spring.ai.openai.chat.options.model}

# OpenRouter properties (dummy values; no test calls the LLM)
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.api-key=test-dummy-key
spring.ai.openai.chat.options.model=test-dummy-model

code2req.output.spec-dir=${java.io.tmpdir}/spec-output
code2req.output.extraction-cache-file=extraction-cache.json
code2req.allowed-libraries.jdk-prefixes=java.,javax.,jakarta.
code2req.allowed-libraries.framework-prefixes=org.springframework.,com.fasterxml.jackson.